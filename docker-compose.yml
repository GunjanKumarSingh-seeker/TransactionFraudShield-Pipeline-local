services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraud_shield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_shield}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_shield}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud_shield}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    
    volumes:
      - ./scripts:/opt/transaction_fraud_shield/scripts
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-fraud_shield}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-fraud_shield123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-fraud_shield} $${MINIO_SECRET_KEY:-fraud_shield123} && mc mb --ignore-existing local/$${S3_BUCKET:-transaction-fraud-shield-lakehouse} && mc anonymous set download local/$${S3_BUCKET:-transaction-fraud-shield-lakehouse}"

  dashboard:
    image: python:3.11-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && python -m fraud_shield.dashboard.app"
    environment:
      GOLD_DATA_PATH: ${GOLD_DATA_PATH:-data/gold}
      DASH_HOST: ${DASH_HOST:-0.0.0.0}
      DASH_PORT: ${DASH_PORT:-8060}
    ports:
      - "8060:8060"
    volumes:
      - .:/app

volumes:
  minio-data: