[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-fraud-shield"
version = "0.1.0"
description = "Real-time fraud detection lakehouse with Kafka, medallion processing, data quality, and dashboards."
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["fraud_shield*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

